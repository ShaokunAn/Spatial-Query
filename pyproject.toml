[build-system]
requires = ["setuptools>=68.0.0", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "SpatialQuery"
version = "0.0.2"
description = "Spatial query tools for analyzing spatial transcriptomics data"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shaokun An", email = "shan12@bwh.harvard.edu" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.23.0",
    "anndata>=0.8.0",
    "pandas>=2.0.3",
    "scipy>=1.10.0",
    "matplotlib>=3.7.5",
    "scikit-learn>=1.3.2",
    "scanpy>=1.9.5",
    "statsmodels>=0.14.0",
    "seaborn>=0.13.2",
    "mlxtend>=0.23.1",
    "tqdm>=4.60.0",
    "zarr>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/ShaokunAn/Spatial-Query"

[project.optional-dependencies]
docs = [
    "sphinx>=5.3",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "myst-parser",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["SpatialQuery*"]
