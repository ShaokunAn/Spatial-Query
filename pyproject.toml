[build-system]
requires = ["setuptools>=68.0.0", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "SpatialQuery"
version = "0.0.2"
description = "Spatial query tools for analyzing spatial transcriptomics data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Shaokun An", email = "shan12@bwh.harvard.edu" }
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "setuptools>=68.0.0",
    "anndata>=0.8.0",
    "pandas>=2.0.3",
    "scipy",
    "matplotlib>=3.7.5",
    "mlxtend>=0.23.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.3.2",
    "statsmodels>=0.14.0",
    "scanpy>=1.9.5",
    "pybind11>=2.6",
]

[project.urls]
Homepage = "https://github.com/ShaokunAn/Spatial-Query"

[tool.setuptools.packages.find]
where = ["."]
include = ["SpatialQuery*"]
